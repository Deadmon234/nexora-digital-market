spring.datasource.url=jdbc:h2:mem:nexora_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

nexora.cors.allowed-origins=http://localhost:3000

nexora.jwt.secret=test-secret-key-for-unit-tests-min-256-bits-long!!
nexora.jwt.access-expiration-ms=86400000
nexora.jwt.refresh-expiration-ms=604800000

# Limite élevée en tests pour ne pas bloquer les scénarios d'inscription répétés
nexora.security.rate-limit.enabled=false
nexora.security.rate-limit.max-requests=10000
nexora.security.rate-limit.window-seconds=60
