spring.application.name=nexora-backend
server.port=8080

spring.profiles.active=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Paris

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Schéma SQL — Hibernate gère le schéma
spring.sql.init.mode=never

# JWT
nexora.jwt.secret=${JWT_SECRET:nexora-dev-secret-key-change-in-production-min-256-bits!!}
nexora.jwt.access-expiration-ms=${JWT_EXPIRATION_MS:86400000}
nexora.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
