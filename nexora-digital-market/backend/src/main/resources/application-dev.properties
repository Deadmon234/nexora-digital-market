# PostgreSQL — développement local (docker compose ou installation locale)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexora_dev}
spring.datasource.username=${DATABASE_USERNAME:nexora}
spring.datasource.password=${DATABASE_PASSWORD:nexora}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

nexora.cors.allowed-origins=http://localhost:3000
