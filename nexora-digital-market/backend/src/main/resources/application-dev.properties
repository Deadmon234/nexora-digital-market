# PostgreSQL — développement local
# Valeurs fixes pour l'installation locale (utilisateur postgres, mot de passe root).
# En prod, utiliser le profil "prod" avec variables d'environnement.
spring.datasource.url=jdbc:postgresql://localhost:5432/nexora_dev
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

nexora.cors.allowed-origins=http://localhost:3000
